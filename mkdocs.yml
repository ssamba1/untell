site_name: untell
site_description: Open-source closed-loop AI-text humanizer — the strongest training-free detector-evasion tool, packaged as a Python library, CLI, skill, MCP server, and REST API.
site_url: https://ssamba1.github.io/untell/
repo_url: https://github.com/ssamba1/untell
edit_uri: blob/main/docs/
copyright: MIT License — untell contributors

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ssamba1/untell
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  # Slugify the way GitHub does. These documents are read on GitHub — the published Pages site is
  # docs/ served directly, and free-ceiling-measured.md is not even in the nav below — so a heading
  # anchor has to match GitHub's rules or the cross-references in it break where people click them.
  # The two differ on em dashes: GitHub renders "Result 33 — the wall" as `result-33--the-wall`,
  # dropping the dash and turning both spaces into hyphens, while python-markdown's default
  # collapses that to one. Nine intra-document links were reported broken for exactly this reason,
  # and every one of them works on GitHub. Matching GitHub makes the strict build an accurate link
  # checker instead of a source of false alarms — which is the only reason it is worth running.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - API Server: api-server.md
  - Demo Page: demo.html

# docs/index.html is the hand-written GitHub Pages landing page, and GitHub Pages serves docs/
# DIRECTLY — no workflow runs mkdocs, so that file is the live site and this config describes a
# second, unpublished one. Both are kept: the landing page is what visitors see, and this build is
# run in CI purely as a link checker over the same documents (`mkdocs build --strict`), which is
# how 47 broken links were found. Excluded here because it would otherwise overwrite the page
# generated from index.md and mkdocs warns about the collision.
exclude_docs: |
  index.html
