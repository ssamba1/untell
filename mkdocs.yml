site_name: untell
site_description: Open-source closed-loop AI-text humanizer — the strongest training-free detector-evasion tool, packaged as a Python library, CLI, skill, MCP server, and REST API.
site_url: https://ssamba1.github.io/untell/
repo_url: https://github.com/ssamba1/untell
edit_uri: blob/main/docs/
copyright: MIT License — untell contributors

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ssamba1/untell
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - API Server: api-server.md
  - Demo Page: demo.html
