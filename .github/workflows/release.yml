name: release

# Publish to PyPI with trusted publishing (no API token stored anywhere). One-time setup on
# pypi.org: add a "pending publisher" for project `untell`, owner `ssamba1`, repository `untell`,
# workflow `release.yml`, environment `pypi`. Then push a tag: `git tag v0.4.0 && git push --tags`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$want" = "$have" ] || { echo "tag $want != pyproject $have"; exit 1; }
      - name: Smoke-test the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/untell flagmath --fpr 0.01 -k 10
          echo "It's a \"test\" -- of the wheel." | /tmp/v/bin/untell stability --detector local:lite
          /tmp/v/bin/python -c "import untell.evidence, untell.bench, untell.training; import importlib.util as u; assert u.find_spec('eval') is None or 'site-packages/eval' not in str(u.find_spec('eval').origin)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
