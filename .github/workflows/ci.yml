name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lite:
    name: lite-tier (no model downloads)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (lite tier + dev tools; mcp is pure-python, no models)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint
        run: ruff check .

      - name: Test (lite tier, zero ML)
        run: pytest -q

      # Every documented claim that CAN be re-checked, re-checked. The derivable ones — registry
      # sizes, which rewriters resolve, calibration constants, console scripts, cross-document
      # links, census figures quoted outside the census — fail the build when they drift. The
      # measured ones cannot run here, so what is enforced is that each states its source.
      #
      # This is not hypothetical maintenance. Its first run found seven dead links in the published
      # documentation index and a README claiming 1124 candidate repos where the census said 1287,
      # and it later caught the README's headline HC3 results table overstating the product with
      # figures no commit reproduces.
      - name: Audit documented claims
        run: untell-audit

      - name: Console scripts wired (entry points resolve)
        run: |
          untell-score "Moreover, the system leverages synergies to facilitate outcomes." --threshold 0.30
          printf 'This sentence is plainly written. Another one here.\n' | untell-sentences
          untell-verify --help
          # `command -v` only proves the shim was written. untell-mcp passed that check while
          # answering --help with silence, because its main() never parsed argv and went straight
          # to serving JSON-RPC on stdin. Every script now has to actually respond; the full
          # 23-script sweep is tests/test_console_scripts_respond.py.
          untell-mcp --help > /dev/null
          untell-mcp --list-tools
          command -v untell-loop untell-prove untell-distill

      # `mkdocs build --strict` is run as a LINK CHECKER, not to publish. GitHub Pages serves
      # docs/ directly and no workflow deploys this build, but it is the only thing that reads
      # every cross-reference in every document — its first run found 47 broken links, including
      # three "Next steps" entries in the quickstart pointing at pages that have never existed.
      # Cheap (under two seconds) and catches the class of rot no test can see.
      - name: Documentation links resolve
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build --strict --site-dir /tmp/untell-site

      # A vulnerable version of a declared dependency is a defect in this repo, not in someone
      # else's. Advisory (`|| true`) on purpose: the alternative is a build that goes red when a
      # CVE lands in a transitive package on a schedule nobody here controls, and a red build that
      # is routinely ignored is worse than an amber one that gets read. The output is the point.
      - name: Dependency advisories (advisory, does not fail the build)
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off --desc || true

  full:
    name: full-tier (torch + real detectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install full + eval extras (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # `quality` (bert-score) included deliberately: its two tests skipped in every
          # environment because nothing installed it, and the code path they cover had a
          # gate that rejected 19 of 20 real rewrites. An optional extra nobody exercises
          # is an untested code path a user can turn on with one pip flag.
          pip install -e ".[full,eval,quality,docs,rich,dev]"
          python -m spacy download en_core_web_sm || true

      - name: Sanity — torch + detectors import and score
        run: |
          python - <<'PY'
          from untell.detectors.base import load_detectors, resolved_tier
          dets = load_detectors("full")
          tier = resolved_tier(dets)
          names = sorted(d.name for d in dets)
          print("tier:", tier, "| detectors:", names)
          assert tier == "full", f"expected full tier, got {tier} ({names})"
          assert "roberta_openai" in names and "mage" in names, names
          PY

      # Loading is not the same as working. fast_detectgpt loaded fine, scored fine, and returned a
      # near-constant ~0.30 for EVERY input for months — a dead detector that the project's own docs
      # then described as an "immovable wall" precisely because it never moved. The sanity step above
      # would have passed the whole time. This one scores known-human and known-AI probes through
      # every detector and fails the build if any is DEAD (no dynamic range) or INVERTED (human
      # scoring above AI).
      - name: Detector integrity — no dead or inverted detectors
        run: untell detector-audit

      - name: Test (full tier)
        run: pytest -q

  linux-install:
    name: linux installer + zero-dep run (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install from the checked-out copy via the POSIX installer (UNTELL_REPO), then run a script
      # zero-dep from an unrelated cwd. Mirrors windows-install for macOS/Linux parity.
      - name: Install the skill via install.sh
        env:
          UNTELL_REPO: ${{ github.workspace }}
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}/claude-skills
        run: sh ./install.sh

      - name: Lite-tier score runs zero-dep from an unrelated cwd
        env:
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}/claude-skills
        run: |
          set -e
          score="$CLAUDE_SKILLS_DIR/untell/scripts/score.py"
          test -f "$score" || { echo "skill not installed: $score missing"; exit 1; }
          cd /tmp  # prove it runs from an unrelated cwd, no PYTHONPATH
          python "$score" "Moreover, the framework leverages synergies to facilitate robust outcomes." --threshold 0.30 > out.json
          cat out.json
          python -c "import json; j=json.load(open('out.json')); assert j['tier']=='lite', j['tier']; assert j['max'] is not None; print('OK zero-dep lite score, max=', j['max'])"

  windows-install:
    name: windows installer + zero-dep run (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `shell: powershell` is Windows PowerShell 5.1 — the exact interpreter where the
      # installer used to abort (git's stderr -> terminating NativeCommandError). Installing
      # from the checked-out copy (UNTELL_REPO) regression-tests *this* commit's installer.
      - name: Install the skill via install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        env:
          UNTELL_REPO: ${{ github.workspace }}
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}\claude-skills
        run: .\install.ps1

      - name: Lite-tier score runs zero-dep from an unrelated cwd
        shell: powershell
        env:
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}\claude-skills
        run: |
          # Relax EAP: GitHub's powershell preamble sets 'stop', which would turn score.py's
          # harmless stderr note into a terminating error. Gate on the real exit code instead.
          $ErrorActionPreference = "Continue"
          $score = Join-Path $env:CLAUDE_SKILLS_DIR "untell\scripts\score.py"
          if (-not (Test-Path $score)) { throw "skill not installed: $score is missing" }
          Set-Location $env:USERPROFILE   # prove it runs from an unrelated cwd, no PYTHONPATH
          $out = python $score "Moreover, the framework leverages synergies to facilitate robust, scalable outcomes." --threshold 0.30
          if ($LASTEXITCODE -ne 0) { throw "score.py failed (exit $LASTEXITCODE)" }
          Write-Host $out
          $json = $out | ConvertFrom-Json
          if ($json.tier -ne "lite") { throw "expected lite tier (zero-dep), got '$($json.tier)'" }
          if ($null -eq $json.max)   { throw "score output has no 'max' field" }
          Write-Host "OK: zero-dep lite score ran from $($PWD.Path) - tier=$($json.tier) max=$($json.max)"

  docker:
    name: docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing built this image, and a shipped Dockerfile that cannot build is the one kind of
      # breakage no unit test reaches. It shipped with `pip install /tmp/untell-*.whl[server]`,
      # where `[server]` is a shell glob character class rather than pip's extras syntax — the
      # pattern never matches a real wheel, the literal string reaches pip, and the build fails
      # with "untell-*.whl is not a valid wheel filename". Both installers have had a CI job since
      # they were written; this artifact did not.
      - name: Build the image
        run: docker build -t untell:ci .

      # Building proves the recipe resolves. Starting it proves the entrypoint and the [server]
      # extra actually came through, which is what the broken line was trying to install.
      - name: The server starts and answers
        run: |
          docker run -d --name untell-ci -p 8000:8000 untell:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null 2>&1; then
              echo "server answered after ${i}s"; break
            fi
            if [ "$i" = "30" ]; then
              echo "server did not answer within 30s; logs:" >&2
              docker logs untell-ci >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/tells             -H 'content-type: application/json'             -d '{"text":"Moreover, the framework leverages robust methodologies at scale."}'             | tee /tmp/tells.json
          python -c "import json,sys; d=json.load(open('/tmp/tells.json')); assert d['tells']>0, d; print('tells:',d['tells'])"

      - name: Stop the container
        if: always()
        run: docker rm -f untell-ci || true

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # .pre-commit-config.yaml declares eight hooks and nothing ran them. Ruff is covered by the
      # lite job, so what went unchecked were the file-hygiene ones — and they had found real
      # things by the time this was added: trailing whitespace in docs/why-best-open-repo.md and a
      # missing final newline in docs/humanizer-census.json, both committed.
      #
      # Linux runner on purpose. `mixed-line-ending --fix=lf` is a no-op here because every Python
      # file is LF in the index (`git ls-files --eol` reports i/lf for all 184); on a Windows
      # checkout with core.autocrlf=true it would rewrite the working tree instead, which says
      # nothing about the repository.
      - name: Run every hook
        run: |
          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run --all-files --show-diff-on-failure
