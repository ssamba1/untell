name: benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 6am UTC

jobs:
  ceiling:
    name: Free-evasion ceiling measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Measure free ceiling
        run: |
          untell-ceiling --rewriter composite --tier lite --json \
            > benchmark-results.json
          cat benchmark-results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Check for regression
        run: |
          python - <<'PY'
          import json
          with open("benchmark-results.json") as f:
              r = json.load(f)
          pre = r.get("pre_flagged_rate", 1.0)
          post = r.get("post_flagged_rate", 1.0)
          print(f"Pre-flagged rate: {pre}")
          print(f"Post-flagged rate: {post}")
          if post > pre:
              print("WARNING: flagged rate increased — possible regression!")
              exit(1)
          else:
              print("OK: flagged rate decreased or stayed the same.")
          PY
