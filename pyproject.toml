[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "untell"
version = "0.3.0"
description = "AI-detector auditing toolkit: measures detector false-positive rates on human writing, verdict stability, and robustness to meaning-preserving edits. Python library, CLI, MCP server, and REST API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "untell contributors" }]
keywords = ["untell", "ai-detection", "detector-evaluation", "false-positives", "robustness-testing", "gptzero", "turnitin", "claude-skill", "nlp", "reproducible-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Base install is intentionally zero-dependency: the "lite" tier runs on the
# standard library alone so the skill installs with no model downloads.
dependencies = []

[project.optional-dependencies]
# Real proxy-detector signal on CPU.
full = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=2.6",
    "spacy>=3.7",
    "sentencepiece>=0.2",
]
# Strongest proxy (Binoculars = 2x Falcon-7B). GPU recommended.
# Includes `full` so torch/transformers are present — Binoculars needs them to run at all.
heavy = [
    "untell[full]",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]
# Benchmark harness datasets (research only).
eval = [
    "datasets>=2.19",
]
# Higher-fidelity quality gate: BERTScore-F1 backend (recall catches prose meaning-drift the
# MiniLM cosine averages away). Optional — the gate falls back to embedding/token-overlap without it.
quality = [
    "bert-score>=0.3.13",
]
# Optional hosted-LLM rewriter providers (headless loop; the skill itself needs neither).
api = [
    "anthropic>=0.40",
    "openai>=1.0",
]
# Commercial AI-detector API clients (the real checkers; each is key-gated at runtime).
commercial = [
    "requests>=2.28",
]
# Browser-driven free-web-UI checking (no API key). Also run: playwright install chromium
browser = [
    "playwright>=1.40",
]
# .docx / .pdf input support
docs = [
    "python-docx>=1.1",
    "pypdf>=4.0",
]
# MCP server (exposes score/sentences/tells/untell/verify_commercial/ceiling/compare/scrub as tools to Claude Desktop & other MCP clients).
# The MCP SDK requires Python >=3.10, but the base package supports 3.9 — gate the extra with an
# environment marker so `.[mcp]` installs nothing (instead of failing to resolve) on 3.9.
mcp = [
    "mcp>=1.0; python_version >= '3.10'",
]
# Production REST API server (FastAPI).
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]
# Rich terminal output (colored diffs, tables, progress bars).
rich = [
    "rich>=13.0",
]
# GPU training moat (RL-against-ensemble / alignment). Run on a GPU box; not used by CI.
train = [
    "trl>=0.12",
    "peft>=0.13",
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "requests>=2.28",
    "fastapi>=0.110",
    # fastapi.testclient (starlette) raises "requires the httpx package" without this, so the whole
    # REST API test module could not run — which is how a test patching a name that does not exist
    # survived in the suite unnoticed.
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/ssamba1/untell"
Repository = "https://github.com/ssamba1/untell"

[project.scripts]
untell = "untell.scripts.cli:main"
untell-score = "untell.scripts.score:main"
untell-loop = "untell.scripts.run:main"
# `humanize` is the PRIMARY name for the loop (`loop` is its alias), but only the alias had a
# standalone script — so `untell-humanize` was "command not found" while the README promised that
# every subcommand has one.
untell-humanize = "untell.scripts.run:main"
untell-verify = "untell.scripts.verify:main"
untell-prove = "eval.prove:main"
untell-sentences = "untell.scripts.sentences:main"
untell-tells = "untell.scripts.tells:main"
untell-voice = "untell.scripts.voice:main"
untell-compare = "eval.compare_humanizers:main"
# Who does a detector fail? FPR by writer subgroup on known-human text (docs/strategy-the-audit-position.md).
untell-subgroup-audit = "eval.subgroup_audit:main"
# A real perplexity signal with no model download, for checking the lite tier's stoplist proxy.
untell-ngram-lm = "eval.ngram_lm:main"
# True GPT-2 perplexity via ONNX + pypi onnxruntime. No HuggingFace in the path.
untell-gpt2-ppl = "eval.gpt2_onnx:main"
untell-mcp = "untell.mcp_server:main"
# The moat: re-check every documented claim that CAN be re-checked, and report how many cannot.
untell-audit = "untell.scripts.audit:main"
# LaTeX: prose extraction for scoring, plus citation verification against a .bib.
untell-latex = "untell.scripts.latex:main"
untell-ceiling = "eval.ceiling:main"
untell-detector-audit = "eval.detector_audit:main"
untell-distill = "training.distill:main"
untell-surrogate = "training.surrogate:main"
untell-eval-policy = "eval.eval_policy:main"
untell-server = "untell.api_server_cli:main"
untell-humanness = "untell.humanness:main"
untell-scrub = "untell.scripts.scrub:main"
untell-numbers = "untell.scripts.numerals:main"
untell-hedges = "untell.scripts.hedges:main"
untell-explain = "untell.scripts.explain:main"
untell-batch = "untell.scripts.batch:main"
untell-watch = "untell.scripts.watch:main"

[tool.setuptools]
packages = [
    "untell",
    "untell.scripts",
    "untell.detectors",
    "untell.rewriter",
    "untell.attacks",
    "eval",
    "training",
]

[tool.setuptools.package-data]
untell = ["SKILL.md", "references/*.md"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["*.ipynb"]  # notebooks use cell magics (!cmd) ruff can't parse

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

# .claude/probes/ are one-off audit/diagnostic scripts, not shipped code. They carry a
# documented per-file exemption (blanket rule ignore) — the rationale lives in
# .claude/probes/RUFF-POLICY.md and coverage is asserted by tests/test_probe_ruff_policy.py
# (every *.py under .claude/probes/ must match a pattern here). Shipped code
# (untell/, tests/, scripts/) stays zero-tolerance and is gated by the ruff CI job.
[tool.ruff.lint.per-file-ignores]
".claude/probes/*.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that load a real model (detector ensemble, sentence-transformers, NLI, T5) are marked
# `slow`. They stay in the default run so CI and `pytest` still cover everything — the marker exists
# so local iteration can use `pytest -m "not slow"` and get an answer in seconds instead of minutes.
# A suite people avoid running is worse than a slower one they actually run.
markers = [
    "slow: loads a real ML model; skip locally with -m 'not slow'",
]
